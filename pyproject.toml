[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntlmscan"
version = "0.1.0"
description = "NTLM scanner - finds HTTP endpoints that advertise NTLM auth"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.7"
dependencies = [
    "requests>=2.32.0",
    "urllib3>=2.0.7",
    "certifi>=2023.7.22",
]

[project.scripts]
ntlmscan = "ntlmscan:main"

[tool.setuptools]
py-modules = ["ntlmscan"]

[tool.setuptools.data-files]
"ntlmscan" = ["paths.dict"]
